[package]
name = "native_pusher"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glam = "0.33.10"
log = "0.4.34"
pollster = "1.0.1"
rand = "0.10.3"
rapier3d = "0.36.0"
wgpu = "30.0.1"
winit = "0.30.13"
rodio = "0.22.2"

# Optimize dependencies even in debug/dev builds for smooth 60+ FPS physics & rendering
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1


